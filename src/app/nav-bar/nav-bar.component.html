<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Holding BPO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto" *ngIf="!isConfigPage">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="'/reporte-general'" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-chart-pie me-1"></i> Reporte General
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="'/reporte-asesor'" routerLinkActive="active">
            <i class="fas fa-users me-1"></i> Reporte por Asesor
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="'/tabla-efectividad'" routerLinkActive="active">
            <i class="fas fa-percentage me-1"></i> Tabla efectividad
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <!-- Botón Columnas con selector de filas en Reporte Asesor -->
        <div *ngIf="!isConfigPage && esReporteAsesor && !isComparando" class="d-flex align-items-center gap-1">
          <button type="button"
                  class="btn btn-sm"
                  [ngClass]="modoDosColumnas ? 'btn-info text-dark font-weight-bold' : 'btn-outline-secondary text-white'"
                  (click)="onToggleColumnasClick()"
                  title="Dividir en 2 tablas para ver los primeros vendedores en ambas">
            <i class="fas fa-table-columns me-1"></i>
            Columnas
          </button>

          <!-- Control de cantidad de filas para la primera tabla -->
          <div *ngIf="modoDosColumnas" class="filas-selector-group" title="Filas de la primera tabla">
            <span class="filas-label me-1">Filas T1:</span>
            <button type="button"
                    class="btn-fila-adjust"
                    (click)="ajustarFilas(-1)"
                    [disabled]="!asesorColumnasService.puedeQuitarFila"
                    title="Menos filas en la primera tabla">−</button>
            <span class="filas-counter">{{ filasPrimeraTabla }}</span>
            <button type="button"
                    class="btn-fila-adjust"
                    (click)="ajustarFilas(1)"
                    [disabled]="!asesorColumnasService.puedeAgregarFila"
                    title="Más filas en la primera tabla">+</button>
          </div>
        </div>

        <button *ngIf="!isConfigPage && esReporteAsesor" 
                type="button" 
                class="btn btn-sm"
                [ngClass]="isComparando ? 'btn-danger' : 'btn-warning text-dark font-weight-bold'"
                (click)="onCompararCrmClick()"
                [title]="isComparando ? 'Quitar la vista de comparación' : 'Comparar con otro CRM registrado'">
          <i class="fas" [ngClass]="isComparando ? 'fa-times me-1' : 'fa-columns me-1'"></i>
          {{ isComparando ? 'Quitar comparación' : 'Comparar con CRM' }}
        </button>
        <button *ngIf="!isConfigPage" type="button" class="btn btn-outline-info btn-sm" (click)="entrarModoTV()" title="Entrar a Modo TV (Optimizado para Pantallas grandes)">
          <i class="bi bi-tv me-1"></i> Modo TV
        </button>
        <button *ngIf="!isConfigPage" type="button" class="btn btn-outline-light btn-sm" (click)="salir()" title="Salir y elegir otra empresa / TV">
          <i class="fas fa-sign-out-alt me-1"></i> Salir
        </button>
        <span class="navbar-text me-3 d-none d-lg-block">
          <i class="fas fa-clock me-1"></i>
          <span class="live-time">{{ currentTime | date:'HH:mm:ss' }}</span>
        </span>
      </div>
    </div>
  </div>
</nav>
